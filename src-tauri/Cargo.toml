[package]
name = "arch-ade"
description = "Local-only file browser and organizer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "arch_ade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arch-ade-core = { path = "../crates/arch-ade-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
dirs = "7"
tracing = "0.1"

[features]
default = ["heic"]
heic = ["arch-ade-core/heic"]
