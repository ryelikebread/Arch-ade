[package]
name = "arch-ade-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OS-agnostic core of Arch-ade: scanning, previews, plans, journal, undo"

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
calamine = "0.36.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "ico", "tiff", "webp"] }
infer = "0.22.0"
notify-debouncer-full = "0.7.0"
plist = "1.10.1"
quick-xml = "0.42.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
trash = "5.2.9"
unicode-normalization = "0.1.25"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

libheif-rs = { version = "3", features = ["embedded-libheif"], optional = true }
regex = "1.13.1"
ureq = { version = "3.4.2", default-features = false, features = ["json"] }

[target.'cfg(unix)'.dependencies]
xattr = "1.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError", "NSArray"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_Graphics_Gdi",
] }

[dev-dependencies]
dirs = "7.0.0"
trash = "5.2.9"

[features]
default = []
# Decode HEIC/HEIF with a bundled libheif (needs cmake and a C++ compiler at build time).
heic = ["dep:libheif-rs"]
