name: Release bundles

# Builds .dmg (macOS), .msi + NSIS .exe (Windows), AppImage + .deb (Linux).
# Code signing / notarization steps are present but skipped until the
# repository variable ENABLE_SIGNING is set to "true" and the secrets below
# exist. See docs/SIGNING.md.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && vars.ENABLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci-import-apple-cert.sh

      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        env:
          # Signing/notarization only happens when these are set (ENABLE_SIGNING).
          APPLE_SIGNING_IDENTITY: ${{ vars.ENABLE_SIGNING == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ vars.ENABLE_SIGNING == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ vars.ENABLE_SIGNING == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ vars.ENABLE_SIGNING == 'true' && secrets.APPLE_TEAM_ID || '' }}

      - name: Sign Windows installers
        if: runner.os == 'Windows' && vars.ENABLE_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: scripts/ci-sign-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: arch-ade-${{ runner.os }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/deb/*.deb
          if-no-files-found: warn
